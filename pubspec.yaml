name: fun_games
description: A collection of real-time multiplayer games with Firebase backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.9
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  crypto: ^3.0.3
  confetti: ^0.7.0
  shared_preferences: ^2.3.2
  flutter_tts: 4.0.2
  rxdart: ^0.28.0
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
